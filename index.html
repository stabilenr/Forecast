<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
  <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
  <title>My Forecast Application</title>
</head>

<body>
  <div class="weather-app">
    <header>
      <form id="search-form">
        <input type="search" id="search-input" class="search-input" placeholder="Enter city" required />
        <input type="submit" value="Search" class="search-button" />
      </form>
    </header>

    <main>
      <div class="current-weather">
        <div>
          <h1 class="current-city" id="current-city">Paris</h1>

          <p class="current-details">
            <span id="current-date"></span>,
            <span id="description"></span>
            <br />
            Humidity:
            <strong><span id="humidity"></span>%</strong>,
            Wind:
            <strong><span id="wind-speed"></span> km/h</strong>
          </p>
        </div>
        <div class="current-temperature">
          <span class="current-temperature-icon" id="icon"></span>
          <span class="current-temperature-value">--</span><span class="current-temperature-unit">°C</span>
        </div>
      </div>
      <div id="forecast" class="current-forecast"></div>
    </main>
    <footer>
      <p>
        This project was coded by
        <a href="https://github.com/stabilenr/" target="_blank" rel="noopener noreferrer">
          Narjis Stabile
        </a>
        and is

        <a href="https://github.com/stabilenr/Forecast.git/" target="_blank" rel="noopener noreferrer">
          on GitHub
        </a>
        and

        <a href="https://myforecastingapp.netlify.app/" target="_blank" rel="noopener noreferrer">
          hosted on Netlify
        </a>
      </p>
    </footer>
  </div>
  <script src="src/index.js"></script>
</body>

</html>
